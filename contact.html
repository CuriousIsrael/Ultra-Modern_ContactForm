<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LightSolution — Contact</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inconsolata:wght@300;400&display=swap"
    rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <!-- Script (type="module" required for Firebase ES imports) -->
  <script type="module" src="script.js"></script>
</head>

<body>

  <div class="card">
    <div class="scanline"></div>
    <div class="tag">LightSolution — Contact</div>
    <h1>Send us a<br><span>message</span></h1>

    <form id="contact-form">

      <div class="form-row">
        <div class="form-group">
          <label for="fname">First name</label>
          <input type="text" id="fname" placeholder="Ada" autocomplete="given-name" required />
        </div>
        <div class="form-group">
          <label for="lname">Last name</label>
          <input type="text" id="lname" placeholder="Lovelace" autocomplete="family-name" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="ada@example.com" autocomplete="email" required />
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <select id="subject">
          <option value="" disabled selected>Select a topic</option>
          <option value="general">General inquiry</option>
          <option value="support">Technical support</option>
          <option value="billing">Billing &amp; payments</option>
          <option value="partnership">Partnership</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Tell us how we can help…" maxlength="500" required></textarea>
        <div class="char-count"><span id="count">0</span> / 500</div>
      </div>

      <button type="submit" class="submit-btn"><span>Send message →</span></button>

    </form>

    <p id="status"></p>

    <!-- Success state (hidden by default) -->
    <div class="success" id="success-section">
      <div class="success-icon">✓</div>
      <h2>Message sent!</h2>
      <p>Thanks for reaching out. The LightSolution team will be in touch shortly.</p>
    </div>

  </div>

</body>

</html>
